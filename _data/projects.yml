- date: WIP
  tag: android
  status: wip
  links:
    - en: narcissus
      url: https://github.com/pablofrelo/narcissus
  en: >-
    A bike, run and walk tracker for Android that looks like a terminal on the Nostromo:
    raw GNSS, filtered distance, a session log with maps and a shareable story card.
    Code written by Claude under my direction, tested on my phone on walks, runs and rides.
  pl: >-
    Licznik rowerowy, biegowy i pieszy na Androida, wyglądający jak terminal na Nostromo:
    surowy GNSS, filtrowany dystans, dziennik sesji z mapkami i karta relacji do udostępnienia.
    Kod napisał Claude pod moim kierunkiem, testowany na moim telefonie na spacerach, biegach i jazdach.
